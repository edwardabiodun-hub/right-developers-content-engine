    {"id": "SPECIFICATION_TERMS", "name": "Specification -> Terms", "definition": "Product and transaction specifications shape commercial terms."},
    {"id": "INQUIRY_COMPLETENESS", "name": "Inquiry Completeness", "definition": "The information needed to assess a buyer request responsibly."},
    {"id": "DESTINATION_FIT", "name": "Destination Fit", "definition": "The interaction between destination, logistics, documentation, and feasibility."},
    {"id": "INSPECTION_BEFORE_COMMITMENT", "name": "Inspection Before Commitment", "definition": "Inspection expectations are aligned before a conversation is treated as executable."},
